services:
  # Backend API
  - type: web
    name: hrms-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt && pip install psycopg2-binary gunicorn whitenoise && cd backend && python manage.py migrate --noinput && python manage.py seed_demo --flush
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --chdir /opt/render/project/src/backend
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DB_ENGINE
        value: url
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: DATABASE_URL
        fromDatabase:
          name: hrms-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: "https://hrms-frontend.onrender.com,https://hrms-frontend-3vz5.onrender.com,https://hrms-frontend-p2nr.onrender.com"

  # Frontend Static Site
  - type: web
    name: hrms-frontend
    env: static
    buildCommand: |
      cd frontend
      npm install
      npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE
        value: https://hrms-backend-p2nr.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: hrms-db
    databaseName: hrms_db
    user: hrms_user
    region: oregon
    plan: free